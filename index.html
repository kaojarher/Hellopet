<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5f97a5">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="桌寵">
<meta name="description" content="可自訂照片的手機桌面寵物">
<title>手機桌寵</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#15343F; --paper:#F3F8F8; --tile:#E2EDEF; --line:#C9DCE0; --muted:#5A7480;
  --sun:#FFC93C; --sun-ink:#3A2A00; --bad:#E2574C; --good:#2fb384;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#E8F2F4; --paper:#162A33; --tile:#21404C; --line:#2E525F; --muted:#9DB8C0; }
}
:root[data-theme="dark"]{ --ink:#E8F2F4; --paper:#162A33; --tile:#21404C; --line:#2E525F; --muted:#9DB8C0; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.pet:focus-visible{outline:3px solid #FFC93C;outline-offset:2px}

/* ---------- 舞台 ---------- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;touch-action:none;background:#b7d4db}
#stage[data-wall="0"]::before{
  content:"";position:absolute;left:14%;top:22%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#FFF3C4,#FFD66B 70%);
  box-shadow:0 0 60px 24px rgba(255,220,120,.35);pointer-events:none;
}
#stage[data-wall="1"]::before{
  content:"";position:absolute;left:70%;top:14%;width:46px;height:46px;border-radius:50%;
  background:#F4F1DA;box-shadow:-12px 4px 0 0 #0e1a2c inset,0 0 40px 10px rgba(244,241,218,.25);pointer-events:none;
}
#rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;overflow:hidden}
#rain.on{opacity:1}
#rain span{position:absolute;top:-8%;width:2px;height:4.5%;background:rgba(230,244,248,.55);border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(118vh)}}

/* ---------- 寵物群 ---------- */
#petsLayer{position:fixed;inset:0;z-index:2;touch-action:none}
.pet{position:absolute;left:0;top:0;will-change:transform;touch-action:none;cursor:grab;outline-offset:6px}
.pet .shadow{position:absolute;left:14%;width:72%;aspect-ratio:10/1.2;bottom:-3%;
  background:radial-gradient(ellipse at center,rgba(8,30,40,.38),rgba(8,30,40,0) 70%);pointer-events:none}
.p-flip,.p-tilt,.p-anim{transform-origin:50% 100%}
.pet img.body{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 5px 7px rgba(8,30,40,.25))}
.p-anim{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
@keyframes hop{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7%) rotate(3deg)}100%{transform:translateY(0) rotate(-3deg)}}
@keyframes jump{
  0%{transform:scale(1.1,.88)}25%{transform:translateY(-34%) scale(.95,1.06)}
  50%{transform:translateY(-40%) scale(1,1)}75%{transform:translateY(0) scale(1.14,.82)}
  90%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}}
@keyframes squash{0%{transform:scale(1,1)}20%{transform:scale(1.3,.55)}45%{transform:scale(.9,1.14)}65%{transform:scale(1.08,.93)}100%{transform:scale(1,1)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-9%) rotate(-8deg)}
  30%{transform:translateX(9%) rotate(8deg)}45%{transform:translateX(-7%) rotate(-6deg)}
  60%{transform:translateX(7%) rotate(6deg)}75%{transform:translateX(-3%) rotate(-3deg)}}
@keyframes munch{0%,100%{transform:scale(1,1)}50%{transform:scale(1.07,.9)}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-5deg) scale(1.05,.96)}75%{transform:rotate(5deg) scale(1.05,.96)}}
@keyframes snooze{0%,100%{transform:rotate(-9deg) scale(1,.97)}50%{transform:rotate(-9deg) scale(1.02,.94)}}
@keyframes shadowJump{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(.6);opacity:.5}}
.pet.walking .p-anim,.pet.running .p-anim{animation:hop .42s ease-in-out infinite}
.pet.sleeping .p-anim{animation:snooze 3.6s ease-in-out infinite}
.pet.sleeping img.body{filter:drop-shadow(0 5px 7px rgba(8,30,40,.25)) brightness(.88)}
.pet.jump .p-anim{animation:jump .8s cubic-bezier(.3,.7,.4,1)}
.pet.jump .shadow{animation:shadowJump .8s}
.pet.squash .p-anim{animation:squash .7s ease-out}
.pet.shake .p-anim{animation:shake .7s ease-in-out}
.pet.munch .p-anim{animation:munch .26s ease-in-out 6}
.pet.wiggle .p-anim{animation:wiggle .5s ease-in-out 2}
.zzz{position:absolute;right:4%;top:-4%;display:none;font:700 22px/1 "Chocolate Classical Sans","Noto Sans TC",sans-serif;color:#fff;
  text-shadow:0 2px 6px rgba(8,30,40,.5);pointer-events:none}
.zzz span{display:inline-block;animation:zfloat 2.2s ease-in-out infinite}
.zzz span:nth-child(2){animation-delay:.4s;font-size:.8em}.zzz span:nth-child(3){animation-delay:.8s;font-size:.65em}
@keyframes zfloat{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.pet.sleeping .zzz{display:block}
.costume{position:absolute;left:50%;top:-6%;font-size:38%;transform:translate(-50%,0);pointer-events:none;line-height:1;filter:drop-shadow(0 2px 3px rgba(8,30,40,.25))}
.namechip{position:absolute;left:50%;bottom:-9%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#fff;
  background:rgba(21,52,63,.55);padding:2px 9px;border-radius:999px;white-space:nowrap;pointer-events:none}
.heartbar{position:absolute;left:50%;top:-13%;transform:translateX(-50%);width:60%;height:5px;border-radius:3px;background:rgba(255,255,255,.5);overflow:hidden;pointer-events:none}
.heartbar i{display:block;height:100%;background:#FF6B81;width:0%}

/* ---------- 對話泡泡 ---------- */
.bubble{
  position:fixed;left:0;top:0;z-index:5;max-width:min(230px,70vw);padding:9px 14px;border-radius:16px;
  background:#fff;color:#15343F;pointer-events:none;opacity:0;transition:opacity .18s;
  font:400 15px/1.5 "Chocolate Classical Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-shadow:0 6px 18px rgba(8,30,40,.22);
}
.bubble.show{opacity:1}
.bubble::after{content:"";position:absolute;left:var(--tx,50%);bottom:-6px;width:12px;height:12px;background:#fff;
  transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.below::after{bottom:auto;top:-6px}

/* ---------- 特效 ---------- */
#fx{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.food{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,0);transition:transform .7s cubic-bezier(.5,0,.9,.6),opacity .7s}
.food.go{transform:translate(-50%,150px) scale(.55);opacity:.2}
.heart{position:absolute;color:#FF6B81;font-size:22px;line-height:1;animation:rise 1.3s ease-out forwards;text-shadow:0 2px 6px rgba(8,30,40,.25)}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px)),-90px) scale(1.1);opacity:0}}

/* ---------- 頂端狀態 / 按鈕 ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none}
#topbar>*{pointer-events:auto}
#status{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 11px;border-radius:999px;background:rgba(255,255,255,.82);
  color:#15343F;font-size:13px;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:64vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status .dot{width:8px;height:8px;border-radius:50%;background:#2fb384;flex:0 0 auto}
#status[data-mode="sleep"] .dot{background:#8a9db5}
#status[data-mode="walk"] .dot,#status[data-mode="follow"] .dot{background:#FFC93C}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#15343F;
  box-shadow:0 3px 10px rgba(8,30,40,.18);flex:0 0 auto}
.topright{display:flex;gap:8px}
#menuBtn{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:#15343F;color:#fff;font-weight:500;font-size:15px;
  box-shadow:0 6px 18px rgba(8,30,40,.3);transition:opacity .2s}
#menuBtn.hide{opacity:0;pointer-events:none}

/* ---------- 底部面板 ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:8;background:var(--paper);color:var(--ink);
  border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 40px rgba(8,30,40,.28);visibility:hidden;transform:translateY(104%);
  transition:transform .26s ease,visibility 0s .26s;max-height:78dvh;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sheet.open{visibility:visible;transform:none;transition:transform .26s ease}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.sh-head strong{font-size:17px}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tile);flex:0 0 auto}
.pettabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.pettab{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:500;white-space:nowrap}
.pettab.on{background:var(--sun);color:var(--sun-ink)}
.addpet{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--tile);font-size:13.5px;color:var(--muted)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--tile);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.stat .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:3px;background:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:14px;background:var(--tile);font-size:12px;line-height:1.2;text-align:center}
.tile.on{background:var(--sun);color:var(--sun-ink)}
.tile:active{transform:scale(.96)}
.row{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px}
.row>span{flex:0 0 76px;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:#e5a812;height:28px}
.row input[type=text]{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink);font:inherit}
.secttl{margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chiprow .chip2{padding:9px 13px;border-radius:12px;background:var(--tile);font-size:13.5px}
.chiprow .chip2.on{background:var(--sun);color:var(--sun-ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{padding:12px 10px;border-radius:14px;background:var(--tile);font-weight:500;font-size:14.5px;text-align:center}
.btn.primary{background:var(--sun);color:var(--sun-ink);grid-column:1/-1;font-size:15.5px}
.btn.quiet{color:var(--muted)}
.btn.danger{color:var(--bad)}

/* ---------- 聊天 ---------- */
#chat{max-height:56dvh;display:flex;flex-direction:column}
#msgs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:110px;max-height:26dvh;padding:2px 2px 8px}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;word-break:break-word}
.msg.pet{align-self:flex-start;background:var(--tile);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--sun);color:var(--sun-ink);border-bottom-right-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--tile);font-size:13px}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--tile);color:var(--ink);font:inherit;font-size:16px}
.send button{width:46px;height:46px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:0 0 auto}

/* ---------- 照片編輯器 ---------- */
#editor{position:fixed;inset:0;z-index:20;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);visibility:hidden;opacity:0;transition:opacity .2s,visibility 0s .2s;
  -webkit-user-select:none;user-select:none}
#editor.open{visibility:visible;opacity:1;transition:opacity .2s}
.ed-title{padding:14px 16px 4px;font-size:17px;font-weight:700}
.ed-sub{padding:0 16px 8px;font-size:12.5px;color:var(--muted)}
#edPrev{flex:1;min-height:0;margin:0 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:conic-gradient(#d3e0e3 25%,#f1f6f7 0 50%,#d3e0e3 0 75%,#f1f6f7 0) 0 0/22px 22px;position:relative}
#edCanvas{display:block;touch-action:manipulation}
.ed-ctrl{padding:8px 16px 4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--tile)}
.seg button{padding:9px 2px;border-radius:10px;font-size:13.5px}
.seg button.on{background:var(--paper);font-weight:700;box-shadow:0 1px 4px rgba(8,30,40,.18)}
.hint{margin:8px 2px 0;font-size:12.5px;color:var(--muted);min-height:1.5em;line-height:1.5}
.ed-ctrl .row{margin-top:8px}
.ed-btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:8px 16px 14px}
#edBusy{position:absolute;left:0;right:0;top:50%;text-align:center;color:var(--muted);font-size:14px;display:none}
.slotbar{display:flex;gap:6px;padding:0 16px 8px}
.slotbtn{flex:1;padding:8px 4px;border-radius:12px;background:var(--tile);font-size:12.5px;text-align:center}
.slotbtn.on{background:var(--sun);color:var(--sun-ink);font-weight:700}

/* ---------- 小遊戲 ---------- */
#game{position:fixed;inset:0;z-index:25;background:rgba(21,52,63,.92);color:#fff;display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#game.on{display:flex}
.g-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;font-size:15px}
#gArea{flex:1;position:relative;overflow:hidden;margin:0 12px 12px;border-radius:18px;background:rgba(255,255,255,.06)}
.gitem{position:absolute;font-size:34px;transform:translate(-50%,-50%)}
#gStart{margin:0 18px calc(18px + env(safe-area-inset-bottom,0px));padding:14px;border-radius:14px;background:#FFC93C;color:#3A2A00;font-weight:700;text-align:center;font-size:15.5px}

/* ---------- 其他 ---------- */
#away{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;display:none;text-align:center;padding:22px 26px;border-radius:20px;
  background:rgba(255,255,255,.9);color:#15343F;box-shadow:0 10px 30px rgba(8,30,40,.25);max-width:82vw}
#away.show{display:block}
#away p{margin:0 0 14px;font-size:15.5px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:30;max-width:84vw;
  padding:10px 16px;border-radius:12px;background:#15343F;color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  .p-anim{animation:none}
  .zzz span{animation:none;opacity:1}
  .pet.walking .p-anim,.pet.running .p-anim,.pet.sleeping .p-anim{animation:none}
}
</style>
</head>
<body>

<div id="stage"><div id="rain"></div></div>
<div id="petsLayer"></div>
<div id="fx"></div>

<div id="away"><p>寵物們都先回家休息了</p><button class="btn primary" id="callBtn" style="display:block;width:100%">叫牠們出來</button></div>

<div id="topbar">
  <div id="status" data-mode="idle"><span class="dot"></span><span id="stText"></span></div>
  <div class="topright">
    <button class="round" id="weatherBtn" aria-label="天氣"></button>
    <button class="round" id="photoBtn" aria-label="更換寵物照片"></button>
  </div>
</div>
<button id="menuBtn" aria-label="開啟選單"><span id="menuIco"></span>選單</button>

<!-- 選單 -->
<section class="sheet" id="sheet" aria-hidden="true" aria-label="寵物選單">
  <div class="grab"></div>
  <div class="sh-head"><strong>寵物選單</strong><button class="x" id="sheetClose" aria-label="關閉"></button></div>
  <div class="pettabs" id="pettabs"></div>
  <div class="stats" id="stats"></div>
  <div class="tiles" id="tiles"></div>
  <label class="row"><span>寵物大小</span><input type="range" id="sizeRange" min="90" max="380" step="1"></label>
  <label class="row"><span>寵物名字</span><input type="text" id="nameIn" maxlength="8" placeholder="幫牠取個名字"></label>
  <div class="secttl">裝扮</div>
  <div class="chiprow" id="costumeRow"></div>
  <div class="secttl">提醒</div>
  <div class="chiprow">
    <button class="chip2" id="pomoBtn">番茄鐘 25 分</button>
    <button class="chip2" id="waterBtn">整點喝水提醒</button>
  </div>
  <div class="btns">
    <button class="btn primary" id="changePhoto">更換寵物照片</button>
    <button class="btn" id="changeBg">自選背景照片</button>
    <button class="btn quiet" id="resetPet">恢復預設造型</button>
    <button class="btn danger" id="removePet">移除這隻寵物</button>
    <button class="btn quiet" id="exitPet" style="grid-column:1/-1">退出（讓牠們回家休息）</button>
  </div>
</section>

<!-- 聊天 -->
<section class="sheet" id="chat" aria-hidden="true" aria-label="聊天">
  <div class="grab"></div>
  <div class="sh-head"><strong id="chatTitle">陪我聊聊天</strong><button class="x" id="chatClose" aria-label="關閉"></button></div>
  <div id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="send"><input id="chatIn" type="text" placeholder="跟牠說點什麼…" maxlength="60" autocomplete="off"><button id="chatSend" aria-label="送出"></button></div>
</section>

<!-- 照片編輯器 -->
<section id="editor" aria-hidden="true" role="dialog" aria-label="調整寵物照片">
  <div class="ed-title">調整寵物照片</div>
  <div class="ed-sub" id="edSub">選擇這張照片要用在哪個表情</div>
  <div class="slotbar" id="slotbar">
    <button class="slotbtn on" data-slot="idle">一般</button>
    <button class="slotbtn" data-slot="happy">開心</button>
    <button class="slotbtn" data-slot="sleepy">睡覺</button>
  </div>
  <div id="edPrev"><canvas id="edCanvas" width="10" height="10"></canvas><div id="edBusy">處理中…</div></div>
  <div class="ed-ctrl">
    <div class="seg" id="edMode" role="group" aria-label="去背方式">
      <button data-m="auto" class="on">自動去背</button><button data-m="green">綠幕</button><button data-m="pick">點選顏色</button><button data-m="none">不去背</button>

/* ---------- 台詞 ---------- */
const L = {
  idle:['今天也要加油喔！','我在這裡陪你～','喝水了嗎？','摸魚時間到？','坐直一點，肩膀放鬆！','再滑五分鐘就去睡吧…','深呼吸，吸——吐——','有沒有想我？','我剛剛偷看了你的螢幕…','要不要起來動一動？'],
  tap:['哎呀！別戳我啦～','嘿嘿，被抓到了！','跳跳跳！','要抱抱嗎？','好癢喔～','你最棒了！','咦？你在叫我嗎？'],

  levelup:['我們感情變更好了！','升級了！謝謝你一直陪我','等級提升！我更喜歡你了']
};
const JOKES = ['為什麼小貓不愛玩線上遊戲？因為牠怕被「滑鼠」抓到。','我問電腦：你會累嗎？它說：不會，我只會「當機」。','什麼東西越洗越髒？水。','小魚問小魚：你在幹嘛？小魚說：我在「魚」樂。'];
function botReply(q,pet){
  const t = q.toLowerCase();
  if(/笑話|好笑|逗我/.test(t)) return pick(JOKES);
  if(/你好|哈囉|嗨|hi|hello|安安/.test(t)) return pick(['嗨嗨～今天過得好嗎？','你來啦！我等你好久了','哈囉！有什麼想跟我說的嗎？']);
  if(/早安|午安|晚安/.test(t)) return pick(['你也是！要好好照顧自己喔','嗯嗯，我會陪著你的']);
  if(/累|煩|難過|壓力|不開心|心情不好/.test(t)) return pick(['辛苦了，先深呼吸三次，我陪你','今天已經很努力了，休息一下也沒關係','抱抱～想說說發生什麼事嗎？']);
  if(/餓|吃|飯|餐/.test(t)) return pick(['我也餓了！從選單餵我吃的吧','吃點好吃的，心情就會變好','想吃什麼？我要草莓！']);
  if(/愛你|喜歡你|想你/.test(t)) return pick(['我也是！最喜歡你了','嘿嘿，害羞了…','那要一直陪我喔']);
  if(/名字|叫什麼|你是誰/.test(t)) return `我是${pet.name}，是住在你手機裡的小夥伴！`;
  if(/睡|睏|想睡/.test(t)) return '那就早點休息吧，我幫你守夜';

  if(/謝謝|感謝/.test(t)) return '不客氣～我最愛幫忙了';
  return pick(['嗯嗯，然後呢？','原來是這樣啊～','我聽著呢，繼續說','哇，真的嗎？','我不太懂，但我支持你！']);
}

/* ---------- 裝扮 ---------- */
const COSTUMES = [ ['hat','🎩','帽子'], ['bow','🎀','蝴蝶結'], ['scarf','🧣','圍巾'], ['shades','🕶️','墨鏡'], ['umbrella','☂️','雨傘'] ];

/* ---------- Pet 類別 ---------- */
const petsLayer = $('#petsLayer'), fx = $('#fx');
let pets = [];
let activeId = null;
let globalHidden = false;

function newPetState(opts){
  opts = opts||{};
  return {
    id: opts.id || uid(),
    name: opts.name || '小夥伴',
    photos: opts.photos || {idle:null,happy:null,sleepy:null},
    sound: opts.sound || null,
    costume: opts.costume || [],
    size: opts.size || Math.round(clamp(innerWidth*0.42,110,220)),
    x: opts.x, y: opts.y,
    dir:1, tilt:0, aspect:1.05, mode:'idle', target:null, goto:null, locked:false,
    affection: opts.affection!=null?opts.affection:20,
    hunger: opts.hunger!=null?opts.hunger:80,
    energy: opts.energy!=null?opts.energy:80,
    lastTick: opts.lastTick || Date.now()
  };
}

function buildDom(state){
  const el = document.createElement('div');
  el.className='pet'; el.tabIndex=0; el.setAttribute('role','button');
  el.setAttribute('aria-label', state.name+'，點一下互動，長按開啟選單');
  el.innerHTML =
    '<div class="shadow"></div>'+
    '<div class="p-flip"><div class="p-tilt"><div class="p-anim"><img class="body" alt=""></div></div></div>'+
    '<div class="costume"></div>'+
    '<div class="heartbar"><i></i></div>'+
    '<div class="namechip"></div>'+
    '<div class="zzz" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>';
  petsLayer.appendChild(el);
  const bubble = document.createElement('div'); bubble.className='bubble'; bubble.setAttribute('role','status'); bubble.setAttribute('aria-live','polite');
  document.body.appendChild(bubble);
  return { el, img: el.querySelector('.body'), flip: el.querySelector('.p-flip'), costumeEl: el.querySelector('.costume'),
    nameEl: el.querySelector('.namechip'), heartEl: el.querySelector('.heartbar i'), bubble };
}

function petH(p){ return p.state.size*p.state.aspect; }
function clampPos(p){
  const w=p.state.size,h=petH(p);
  p.state.x = clamp(p.state.x, -w*0.15, Math.max(-w*0.15, innerWidth - w*0.85));
  p.state.y = clamp(p.state.y, TOP, Math.max(TOP, innerHeight - h - 6));
}
function currentPhoto(state){
  if(state.mode==='sleep' && state.photos.sleepy) return state.photos.sleepy;
  if(state.affection>=60 && state.photos.happy) return state.photos.happy;
  return state.photos.idle || DEFAULT_IMG;
}
function applyPhoto(p, first){
  const src = currentPhoto(p.state);
  if(p._lastSrc===src) return;
  const im = new Image();
  im.onload = () => {
    const bottom = p.state.y + petH(p);
    p.state.aspect = im.naturalHeight/im.naturalWidth || 1;
    p.dom.img.src = src; p._lastSrc = src;
    if(!first){ p.state.y = bottom - petH(p); }
    clampPos(p); render(p);
  };
  im.onerror = () => { if(src!==DEFAULT_IMG){ p.dom.img.src=DEFAULT_IMG; p._lastSrc=DEFAULT_IMG; } };
  im.src = src;
}
function render(p){
  const s=p.state;
  p.dom.el.style.width = s.size+'px';
  p.dom.el.style.transform = `translate(${s.x.toFixed(1)}px,${s.y.toFixed(1)}px)`;
  p.dom.flip.style.transform = `scaleX(${s.dir}) rotate(${s.tilt.toFixed(1)}deg)`;
  p.dom.nameEl.textContent = s.name;
  p.dom.heartEl.style.width = clamp(s.affection,0,100)+'%';
  p.dom.costumeEl.innerHTML = s.costume.map(id=>{ const c=COSTUMES.find(c=>c[0]===id); return c?c[1]:''; }).join(' ');
}
function play(p,name,ms){
  const el=p.dom.el;
  el.classList.remove('jump','squash','shake','munch','wiggle');
  void el.offsetWidth; el.classList.add(name);
  clearTimeout(p._playT); p._playT = setTimeout(()=>el.classList.remove(name), ms);
}
function say(p,text,ms){
  ms = ms||2800;
  p.dom.bubble.textContent=text; p.dom.bubble.classList.add('show'); p._bubbleUntil = performance.now()+ms;
}
function placeBubble(p, now){
  const b=p.dom.bubble;
  if(!b.classList.contains('show')) return;
  if(now>p._bubbleUntil || globalHidden){ b.classList.remove('show'); return; }
  const bw=b.offsetWidth, bh=b.offsetHeight, h=petH(p), s=p.state;
  const spaceAbove = s.y - TOP + 46, spaceBelow = innerHeight - (s.y+h) - 24;
  const above = spaceAbove >= bh+12 || spaceAbove >= spaceBelow;
  let by = above ? s.y - bh - 12 : s.y + h + 16;
  by = clamp(by, TOP-40, innerHeight-bh-8);
  const bx = clamp(s.x + s.size/2 - bw/2, 8, innerWidth-bw-8);
  b.classList.toggle('below', !above);
  b.style.setProperty('--tx', clamp(s.x+s.size/2-bx, 18, bw-18)+'px');
  b.style.transform = `translate(${bx.toFixed(1)}px,${by.toFixed(1)}px)`;
}
function burst(p,n){
  n=n||5; const s=p.state, cx=s.x+s.size/2, cy=s.y+petH(p)*0.2;
  for(let i=0;i<n;i++){
    const h=document.createElement('span'); h.className='heart'; h.textContent='♥';
    h.style.left=(cx+(Math.random()-.5)*s.size*0.6)+'px'; h.style.top=(cy+Math.random()*20)+'px';
    h.style.setProperty('--dx',((Math.random()-.5)*40)+'px'); h.style.animationDelay=(i*90)+'ms';
    fx.appendChild(h); setTimeout(()=>h.remove(),1700);
  }
}
const STATUS={idle:'待機中',walk:'散步中',sleep:'睡覺中',follow:'跟隨中'};
function gainAffection(p, n){
  const before = Math.floor(p.state.affection/100);
  p.state.affection = clamp(p.state.affection+n,0,999);
  const after = Math.floor(p.state.affection/100);
  if(after>before){ say(p, pick(L.levelup),3000); burst(p,8); toast(`${p.state.name} 的好感等級提升到 Lv.${after+1}！`); }
  savePets();
}
function setMode(p,m){
  const s=p.state, prev=s.mode;
  if(prev==='walk'||prev==='follow') s.dir=1;
  s.mode=m; s.target=null;
  p.dom.el.classList.toggle('sleeping',m==='sleep');
  p.dom.el.classList.toggle('walking',m==='walk');
  if(m!=='follow') p.dom.el.classList.remove('running');
  applyPhoto(p);
  updateUI();
}
function wake(p){ if(p.state.mode==='sleep'){ setMode(p,'idle'); say(p,pick(L.wake)); play(p,'jump',800); return true; } return false; }
let lastTapAnim=-1;
function tapPet(p){
  if(wake(p)) return;
  const acts=[['jump',800],['squash',700],['shake',700]];
  let i; do{ i=Math.floor(Math.random()*acts.length); }while(i===lastTapAnim&&acts.length>1); lastTapAnim=i;
  play(p,acts[i][0],acts[i][1]); say(p,pick(L.tap)); gainAffection(p,1); vib(8);
}
function patPet(p){ if(p.state.mode==='sleep') setMode(p,'idle'); play(p,'wiggle',1000); burst(p,6); say(p,pick(L.pat)); gainAffection(p,3); vib(12); }
function feedPet(p){
  if(p.state.mode==='sleep') setMode(p,'idle');
  closeSheets();
  const f=document.createElement('div'); f.className='food'; f.textContent=pick(['🍙','🍓','🐟','🍪','🍩','🥕','🍉']);
  f.style.left=(p.state.x+p.state.size/2)+'px'; f.style.top=(p.state.y+petH(p)*0.35-150)+'px';
  fx.appendChild(f); requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.add('go')));
  setTimeout(()=>{ f.remove(); play(p,'munch',1600); burst(p,4); say(p,pick(L.feed));
    p.state.hunger = clamp(p.state.hunger+25,0,100); gainAffection(p,2); vib(15); applyPhoto(p); },720);
}
function playSound(p){
  if(!p.state.sound){ $('#sndFile').click(); return; }
  try{ const a=new Audio(p.state.sound); a.play().catch(()=>{}); }catch(e){}
  play(p,'wiggle',900);
}

const ACT = {
  chat(p){ openChat(p); },
  pat(p){ patPet(p); },
  feed(p){ feedPet(p); },
  walk(p){ if(p.state.mode==='walk'){ setMode(p,'idle'); } else { setMode(p,'walk'); p.state.dir=Math.random()<.5?1:-1; say(p,pick(L.walk)); } closeSheets(); },
  sleep(p){ if(p.state.mode==='sleep'){ wake(p); } else { setMode(p,'sleep'); say(p,pick(L.sleep)); } closeSheets(); },
  follow(p){ if(p.state.mode==='follow'){ setMode(p,'idle'); } else { setMode(p,'follow'); say(p,pick(L.follow),3200); } closeSheets(); },
  lock(p){ p.state.locked=!p.state.locked; savePets(); updateUI(); toast(p.state.locked?'位置已鎖定，不會被誤拖':'已解除鎖定'); },
  wall(){ nextWall(); },
  install(){ closeSheets(); doInstall(); },
  sound(p){ playSound(p); },
  game(p){ closeSheets(); openGame(p); }
};
const TILES=[
  ['chat','chat','陪我聊天'],['pat','heart','摸摸頭'],['feed','bowl','餵吃的'],['walk','walk','走路'],
  ['sleep','moon','睡覺'],['follow','finger','跟隨手指'],['sound','sound','播放聲音'],['game','game','小遊戲'],
  ['lock','lock','鎖定位置'],['wall','layers','換背景'],['install','install','安裝到桌面']
];
$('#tiles').innerHTML = TILES.map(([id,ic,lb])=>`<button class="tile" data-id="${id}" ${['walk','sleep','follow','lock'].includes(id)?'data-toggle="1"':''}>${icon(ic)}<span>${lb}</span></button>`).join('');
$('#tiles').addEventListener('click',e=>{ const b=e.target.closest('.tile'); if(b && active()) ACT[b.dataset.id](active()); else if(b && ACT[b.dataset.id].length===0) ACT[b.dataset.id](); });

/* ---------- 背景 ---------- */
const WALLS=[
  'linear-gradient(180deg,#eaf2f3 0%,#b7d4db 38%,#8dbac5 57.5%,#4d8a9a 57.5%,#2b5a6a 100%)',
  'linear-gradient(180deg,#0e1a2c 0%,#22375a 58%,#3a5a80 100%)',

function applyWall(){
  if(wallIdx===3 && !bgimg) wallIdx=0;
  stage.dataset.wall=wallIdx;
  stage.style.background = wallIdx===3 ? `center / cover no-repeat url("${bgimg}")` : WALLS[wallIdx];

/* ---------- 雨效果 ---------- */
const rainEl=$('#rain');
function setRain(on){
  rainEl.classList.toggle('on',on);
  if(on && !rainEl.childElementCount){

const WEATHER = { now:null };
function weatherLabel(code){
  if(code===0) return '晴朗';
  if(code<=3) return '多雲';
  if(code<=48) return '有霧';
  if(code<=67) return '下雨';
  if(code<=77) return '下雪';
  if(code<=82) return '陣雨';
  if(code>=95) return '雷雨';
  return '陰天';
}
function fetchWeather(){
  if(!('geolocation' in navigator)){ toast('這個瀏覽器不支援定位，無法取得天氣'); return; }
  toast('正在取得目前位置的天氣…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude,longitude}=pos.coords;
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`;
      const res=await fetch(url); const data=await res.json();
      const temp=data.current.temperature_2m, code=data.current.weather_code, label=weatherLabel(code);
      WEATHER.now={temp,code,label};
      const rain = code>=51 && code<=82 || code>=95;
      setRain(rain);
      toast(`現在 ${Math.round(temp)}°C，${label}`);
      const p=active();
      if(p) say(p, rain?'外面在下雨，記得帶傘～':(temp>=28?'外面好熱，要多喝水喔':'現在天氣還不錯～'),3600);
    }catch(err){ toast('抓不到天氣資料，請稍後再試'); }
  },()=>{ toast('沒有取得定位權限，無法查天氣'); },{timeout:8000});
}

/* ---------- 指標互動：拖動 / 點擊 / 長按 / 雙指縮放 / 多寵物命中測試 ---------- */
function hitTest(x,y){
  for(let i=pets.length-1;i>=0;i--){
    const p=pets[i], r=p.dom.el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return p;
  }
  return null;
}
const pointers=new Map();
let drag=null, pinch=null, ignoreTap=false;
const pdist = () => { const [a,b]=[...pointers.values()]; return Math.hypot(a.x-b.x,a.y-b.y); };
petsLayer.addEventListener('pointerdown',e=>{
  if(globalHidden) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ petsLayer.setPointerCapture(e.pointerId); }catch(_){}
  if(pointers.size===2){
    if(drag){ clearTimeout(drag.timer); drag.el.classList.remove('running'); drag=null; }
    const hp = hitTest(e.clientX,e.clientY);
    pinch={d0:Math.max(pdist(),1), s0: hp?hp.state.size:(active()?active().state.size:150), pet: hp||active()};
    ignoreTap=true; return;
  }
  if(pointers.size>2) return;
  ignoreTap=false;
  const hit = hitTest(e.clientX,e.clientY);
  if(!hit){
    if(openEl){ closeSheets(); return; }
    const followers = pets.filter(p=>p.state.mode==='follow');
    followers.forEach(p=>{ p.state.target={x:e.clientX,y:e.clientY}; });
    return;
  }
  activeId = hit.state.id;
  drag={id:e.pointerId,pet:hit,sx:e.clientX,sy:e.clientY,ox:hit.state.x,oy:hit.state.y,moved:false,long:false,el:hit.dom.el,
    timer:setTimeout(()=>{ if(drag && !drag.moved){ drag.long=true; vib(18); openMenu(); } },520)};
});
petsLayer.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && pointers.size>=2 && pinch.pet){
    const v=clamp(pinch.s0*pdist()/pinch.d0,90,380); setSize(pinch.pet,v); if(pinch.pet.state.id===activeId) $('#sizeRange').value=pinch.pet.state.size; return;
  }
  if(!drag || drag.id!==e.pointerId) return;
  const p=drag.pet, dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)>8){
    drag.moved=true; clearTimeout(drag.timer);
    if(p.state.locked){ toast('位置已鎖定，可在選單解除'); }
    else { if(p.state.mode!=='idle') setMode(p,'idle'); p.state.goto=null; p.dom.el.classList.add('running'); }
  }
  if(drag.moved && !p.state.locked){
    const nx=drag.ox+dx, vx=nx-p.state.x; p.state.x=nx; p.state.y=drag.oy+dy; clampPos(p);
    if(Math.abs(vx)>1.2) p.state.dir=vx>0?1:-1;
    p.state.tilt=clamp(p.state.tilt*0.6+vx*1.2,-16,16);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(drag && drag.id===e.pointerId){
    const d=drag, p=d.pet; drag=null; clearTimeout(d.timer); p.dom.el.classList.remove('running');
    if(!d.long){
      if(!d.moved){ if(!ignoreTap && e.type==='pointerup') tapPet(p); }
      else if(!p.state.locked){ play(p,'squash',600); if(Math.random()<.35) say(p,pick(L.drop)); savePets(); }
    }
  }
  if(pointers.size===0) ignoreTap=false;
}

/* ---------- 主迴圈 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(3,(now-last)/16.67); last=now;
  if(!globalHidden){
    pets.forEach(p=>{
      const s=p.state;
      const dragging = drag && drag.pet===p && drag.moved && !s.locked;
      if(!dragging){
        if(s.goto){
          const k=1-Math.pow(0.86,dt); s.x+=(s.goto.x-s.x)*k; s.y+=(s.goto.y-s.y)*k;
          if(Math.hypot(s.goto.x-s.x,s.goto.y-s.y)<0.6) s.goto=null;
        }
        if(s.mode==='walk'){
          const sp=(0.9+s.size/260)*dt; s.x+=s.dir*sp;
          const minX=-s.size*0.15, maxX=innerWidth-s.size*0.85;
          if(s.x>=maxX){ s.x=maxX; s.dir=-1; } else if(s.x<=minX){ s.x=minX; s.dir=1; }
          s.tilt*=Math.pow(0.8,dt);
        } else if(s.mode==='follow' && s.target){
          const tx=s.target.x-s.size/2, ty=s.target.y-petH(p)-26;
          const dx=tx-s.x, dy=ty-s.y, k=1-Math.pow(0.91,dt);
          s.x+=dx*k; s.y+=dy*k; clampPos(p);
          if(Math.abs(dx)>8) s.dir=dx>0?1:-1;
          const moving=Math.hypot(dx*k,dy*k)>0.7; p.dom.el.classList.toggle('running',moving);
          s.tilt*=Math.pow(0.8,dt);
        } else {
          s.tilt*=Math.pow(0.86,dt); if(Math.abs(s.tilt)<0.05) s.tilt=0;
        }
      }
      render(p); placeBubble(p,now);
    });
  }
  requestAnimationFrame(loop);
}

}

/* ---------- 檔案讀取 ---------- */
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('decode')); im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
function readDataUrl(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(new Error('read')); fr.onload=()=>res(fr.result); fr.readAsDataURL(file); });
}

  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const im=await readImage(f); const sc=Math.min(1,1100/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*sc); c.height=Math.round(im.naturalHeight*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    bgimg=c.toDataURL('image/jpeg',0.8); wallIdx=3; applyWall();
    if(!store.set('bgimg',bgimg)) toast('背景已套用，但瀏覽器無法儲存，下次需重選');
    else toast('已換成你的背景');
  }catch(err){ toast('這張照片無法讀取，請換一張'); }
});
$('#sndFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; const p=active(); if(!f||!p) return;
  if(f.size>1500000){ toast('音檔太大了，請用短一點的片段（建議 5 秒內）'); return; }
  try{ const url=await readDataUrl(f); p.state.sound=url; if(!savePets()) toast('聲音已套用，但瀏覽器無法儲存'); else toast('已加入專屬聲音'); playSound(p); }
  catch(err){ toast('這個音檔無法讀取'); }
});

/* ---------- 照片編輯器（去背 + 貼紙白邊 + 多表情插槽） ---------- */
const ED={src:null,data:null,mode:'auto',tol:60,edge:1,outline:true,key:null,seed:null,autoKey:[255,255,255],out:null,pad:0,bx:0,by:0,raf:0,slot:'idle',petRef:null};
const edEl=$('#editor'), edCanvas=$('#edCanvas'), edPrev=$('#edPrev'), edHint=$('#edHint');
const HINTS={
  auto:'照片背景單純時效果最好。去不乾淨，就直接點一下照片上的背景色。',
  green:'適合綠幕照片。若人物衣服偏綠，請調低去背力度。',
  pick:'請點一下照片上要去除的背景顏色。',
  none:'保留整張照片，適合本來就是透明背景的 PNG。'
};
const SLOT_LABEL={idle:'一般表情：日常待機時顯示',happy:'開心表情：好感度較高、被摸頭時顯示',sleepy:'睡覺表情：進入睡覺模式時顯示'};
$('#slotbar').addEventListener('click',e=>{
  const b=e.target.closest('.slotbtn'); if(!b) return;
  document.querySelectorAll('.slotbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  ED.slot=b.dataset.slot; $('#edSub').textContent=SLOT_LABEL[ED.slot];
});
async function openEditor(file){
  ED.petRef = active(); if(!ED.petRef) return;
  let im; try{ im=await readImage(file); }catch(e){ toast('這張照片無法讀取，請換一張'); return; }
  const sc=Math.min(1,560/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(2,Math.round(im.naturalWidth*sc)), h=Math.max(2,Math.round(im.naturalHeight*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(im,0,0,w,h);
  ED.src=c; ED.data=ctx.getImageData(0,0,w,h);
  let clear=0; const d=ED.data.data; for(let i=3;i<d.length;i+=4) if(d[i]<250) clear++;
  ED.autoKey=cornerKey(); ED.seed=null; ED.key=null;
  ED.mode = clear>w*h*0.03 ? 'none' : 'auto';
  ED.tol=60; ED.edge=1; ED.outline=true; ED.slot='idle';
  document.querySelectorAll('.slotbtn').forEach(x=>x.classList.toggle('on',x.dataset.slot==='idle'));
  $('#edSub').textContent=SLOT_LABEL.idle;
  $('#edTol').value=ED.tol; $('#edEdge').value=ED.edge; $('#edOutline').checked=true;
  syncSeg();
  edEl.classList.add('open'); edEl.setAttribute('aria-hidden','false'); closeSheets();
  schedule();
}
function syncSeg(){
  document.querySelectorAll('#edMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===ED.mode));
  edHint.textContent=HINTS[ED.mode];
  if(ED.mode==='green'){ $('#edTol').value=ED.tol=Math.max(ED.tol,90); }
}
function cornerKey(){
  const {width:w,height:h}=ED.src, d=ED.data.data, P=Math.max(1,Math.min(6,w>>1,h>>1));
  const cs=[[0,0],[w-P,0],[0,h-P],[w-P,h-P]].map(([x0,y0])=>{
    let r=0,g=0,b=0,n=0;
    for(let y=0;y<P;y++)for(let x=0;x<P;x++){ const p=((y0+y)*w+x0+x)*4; if(d[p+3]<10) continue; r+=d[p];g+=d[p+1];b+=d[p+2];n++; }
    return n?[r/n,g/n,b/n]:null;
  }).filter(Boolean);
  if(!cs.length) return [255,255,255];
  let best=cs[0], bn=-1;
  for(const c of cs){
    const near=cs.filter(o=>Math.hypot(o[0]-c[0],o[1]-c[1],o[2]-c[2])<60);
    if(near.length>bn){ bn=near.length; best=[0,1,2].map(k=>near.reduce((s,o)=>s+o[k],0)/near.length); }
  }
  return best;
}
function boxBlur(a,w,h,r){
  const tmp=new Float32Array(a.length), out=new Float32Array(a.length), k=2*r+1;
  for(let y=0;y<h;y++){
    const row=y*w; let s=0;
    for(let x=-r;x<=r;x++) s+=a[row+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){ tmp[row+x]=s/k; s+=a[row+Math.min(x+r+1,w-1)]-a[row+Math.max(x-r,0)]; }
  }
  for(let x=0;x<w;x++){
    let s=0; for(let y=-r;y<=r;y++) s+=tmp[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){ out[y*w+x]=s/k; s+=tmp[Math.min(y+r+1,h-1)*w+x]-tmp[Math.max(y-r,0)*w+x]; }
  }
  return out;
}
function schedule(){ if(ED.raf) return; ED.raf=requestAnimationFrame(()=>{ ED.raf=0; processED(); }); }
function processED(){
  const {width:w,height:h}=ED.src, od=ED.data.data, n=w*h;
  const outData=new ImageData(new Uint8ClampedArray(od),w,h), o=outData.data;
  if(ED.mode!=='none'){
    const bg=new Uint8Array(n);
    if(ED.mode==='green'){
      const thr=Math.max(14,120-ED.tol*0.7);
      for(let i=0;i<n;i++){ const p=i*4; if(od[p+3]<10 || (od[p+1]>90 && od[p+1]-Math.max(od[p],od[p+2])>thr)) bg[i]=1; }
    } else {
      const key=(ED.mode==='pick'&&ED.key)?ED.key:ED.autoKey, t2=ED.tol*ED.tol, st=[];
      const match=i=>{ const p=i*4; if(od[p+3]<10) return true; const dr=od[p]-key[0],dg=od[p+1]-key[1],db=od[p+2]-key[2]; return dr*dr+dg*dg+db*db<=t2; };
      const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h) return; const i=y*w+x; if(bg[i]||!match(i)) return; bg[i]=1; st.push(i); };
      for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
      for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
      if(ED.mode==='pick'&&ED.seed) push(ED.seed.x,ED.seed.y);
      while(st.length){ const i=st.pop(), x=i%w, y=(i/w)|0; push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1); }
    }
    let m=bg;
    if(ED.edge>0){
      m=new Uint8Array(bg);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const i=y*w+x; if(bg[i]) continue;
        if((x>0&&bg[i-1])||(x<w-1&&bg[i+1])||(y>0&&bg[i-w])||(y<h-1&&bg[i+w])) m[i]=1; }
    }
    let a=new Float32Array(n); for(let i=0;i<n;i++) a[i]=m[i]?0:1;
    if(ED.edge>0) a=boxBlur(a,w,h,ED.edge);
    for(let i=0;i<n;i++){
      const p=i*4; o[p+3]=Math.round(od[p+3]*a[i]);
      if(ED.mode==='green' && a[i]<1 && o[p+1]>Math.max(o[p],o[p+2])) o[p+1]=Math.max(o[p],o[p+2]);
    }
  }
  let minX=w,minY=h,maxX=-1,maxY=-1,cnt=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(o[(y*w+x)*4+3]>24){ cnt++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  const empty = cnt < n*0.004;
  if(empty){ minX=0;minY=0;maxX=w-1;maxY=h-1; }
  const bw=maxX-minX+1, bh=maxY-minY+1;
  const full=document.createElement('canvas'); full.width=w; full.height=h; full.getContext('2d').putImageData(outData,0,0);
  const pad = ED.outline ? Math.max(3,Math.round(Math.max(bw,bh)*0.02)) : 0;
  const fc=ED.out||(ED.out=document.createElement('canvas')); fc.width=bw+pad*2; fc.height=bh+pad*2;
  const c=fc.getContext('2d'); c.clearRect(0,0,fc.width,fc.height);
  if(pad){
    const sil=document.createElement('canvas'); sil.width=fc.width; sil.height=fc.height;
    const s=sil.getContext('2d'); s.drawImage(full,minX,minY,bw,bh,pad,pad,bw,bh);
    s.globalCompositeOperation='source-in'; s.fillStyle='#fff'; s.fillRect(0,0,sil.width,sil.height);
    for(let k=0;k<28;k++){ const ang=k/28*Math.PI*2; c.drawImage(sil,Math.cos(ang)*pad,Math.sin(ang)*pad); }
  }
  c.drawImage(full,minX,minY,bw,bh,pad,pad,bw,bh);
  ED.pad=pad; ED.bx=minX; ED.by=minY;
  edCanvas.width=fc.width; edCanvas.height=fc.height;
  const dc=edCanvas.getContext('2d'); dc.clearRect(0,0,fc.width,fc.height); dc.drawImage(fc,0,0);
  fitCanvas();
  if(empty && ED.mode!=='none') edHint.textContent='去掉的部分太多了，請調低「去背力度」，或改用「點選顏色」。';
  else edHint.textContent=HINTS[ED.mode];
}
function fitCanvas(){
  const aw=edPrev.clientWidth-16, ah=edPrev.clientHeight-16;
  if(aw<=0||ah<=0||!edCanvas.width) return;
  const s=Math.min(aw/edCanvas.width, ah/edCanvas.height);
  edCanvas.style.width=Math.round(edCanvas.width*s)+'px'; edCanvas.style.height=Math.round(edCanvas.height*s)+'px';
}
$('#edMode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  ED.mode=b.dataset.m; if(ED.mode==='auto'){ ED.tol=Math.min(ED.tol,120); $('#edTol').value=ED.tol; }
  syncSeg(); schedule();
});
$('#edTol').addEventListener('input',e=>{ ED.tol=+e.target.value; schedule(); });
$('#edEdge').addEventListener('input',e=>{ ED.edge=+e.target.value; schedule(); });
$('#edOutline').addEventListener('change',e=>{ ED.outline=e.target.checked; schedule(); });
edCanvas.addEventListener('pointerdown',e=>{
  if(ED.mode==='none'||!ED.src) return;
  const r=edCanvas.getBoundingClientRect();
  const sx=Math.round((e.clientX-r.left)*edCanvas.width/r.width - ED.pad + ED.bx);
  const sy=Math.round((e.clientY-r.top)*edCanvas.height/r.height - ED.pad + ED.by);
  const {width:w,height:h}=ED.src; if(sx<0||sy<0||sx>=w||sy>=h) return;
  const d=ED.data.data; let R=0,G=0,B=0,N=0;
  for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){ const xx=clamp(sx+x,0,w-1), yy=clamp(sy+y,0,h-1), p=(yy*w+xx)*4; if(d[p+3]<10) continue; R+=d[p];G+=d[p+1];B+=d[p+2];N++; }
  if(!N) return;
  ED.key=[R/N,G/N,B/N]; ED.seed={x:sx,y:sy}; ED.mode='pick'; syncSeg(); schedule();
});
function closeEditor(){ edEl.classList.remove('open'); edEl.setAttribute('aria-hidden','true'); ED.src=null; ED.data=null; }
$('#edCancel').addEventListener('click',closeEditor);
$('#edOk').addEventListener('click',()=>{
  if(!ED.out || !ED.petRef) return;
  const fc=ED.out, sc=Math.min(1,512/Math.max(fc.width,fc.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(fc.width*sc)); c.height=Math.max(1,Math.round(fc.height*sc));
  c.getContext('2d').drawImage(fc,0,0,c.width,c.height);
  const url=c.toDataURL('image/png');
  const p=ED.petRef;
  p.state.photos[ED.slot]=url; p._lastSrc=null;
  const ok=savePets();
  applyPhoto(p); closeEditor();
  if(!ok) toast('已換上新照片，但瀏覽器無法儲存，下次開啟需重選');
  else toast(ED.slot==='idle'?'換好了！':'這個表情也設定好了！');
  if(ED.slot==='idle') setTimeout(()=>{ play(p,'jump',800); burst(p,5); say(p,'哇，這是新的我嗎？'); },300);
});
addEventListener('resize',()=>{ calcTop(); pets.forEach(p=>{ clampPos(p); render(p); }); if(edEl.classList.contains('open')) fitCanvas(); });

/* ---------- 儲存 / 讀取 ---------- */
function savePets(){
  const data = pets.map(p=>({
    id:p.state.id,name:p.state.name,photos:p.state.photos,sound:p.state.sound,costume:p.state.costume,
    size:p.state.size,x:p.state.x,y:p.state.y,affection:p.state.affection,hunger:p.state.hunger,energy:p.state.energy,lastTick:p.state.lastTick
  }));
  return store.set('pets',data) && store.set('activeId',activeId);
}

/* ---------- 啟動 ---------- */
calcTop();
applyWall();
const saved = store.get('pets',null);
if(saved && saved.length){
  saved.forEach((sv,i)=>{
    const st = newPetState(sv);
    if(st.x==null || st.y==null){ st.x=(innerWidth-st.size)/2+i*30; st.y=innerHeight*0.44-st.size*1.05/2; }
    const dom = buildDom(st);
    const p={state:st,dom,_lastSrc:null};
    pets.push(p); clampPos(p); applyPhoto(p,true); render(p);
  });
  activeId = store.get('activeId', pets[0].state.id);
  if(!pets.find(p=>p.state.id===activeId)) activeId = pets[0].state.id;
} else {
  const st = newPetState({ x:(innerWidth-160)/2, y:innerHeight*0.44-84 });
  const dom = buildDom(st);
  const p = {state:st,dom,_lastSrc:null};
  pets.push(p); clampPos(p); applyPhoto(p,true); render(p);
  activeId = st.id; savePets();
}
requestAnimationFrame(loop);
setTimeout(()=>{
  const hr=new Date().getHours();
  const p=active();
  if(p){
    say(p, hr<5?'這麼晚了還沒睡？':hr<11?'早安！今天也一起加油':hr<14?'午安！吃飯了嗎？':hr<18?'下午好～喝口水吧':'晚上好！今天辛苦了');
    play(p,'jump',800);
    if(!p.state.photos.idle) setTimeout(()=>toast('點右上角相片圖示，換成你專屬的寵物照片'),2200);
  }
},500);
})();
